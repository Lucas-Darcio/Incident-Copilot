groups:
  - name: app-fake-alerts
    rules:
      - alert: HighCPUUsage
        expr: cpu_usage_percent > 80
        for: 15s
        # "for: 15s" evita alertar por um pico momentâneo -
        # a condição precisa se manter por 15s seguidos
        labels:
          severity: critical
        annotations:
          summary: "High CPU detected in {{ $labels.instance }}"
          description: "cpu_usage_percent is at {{ printf \"%.1f\" $value }}% (threshold: 80%) for more than 15s"
